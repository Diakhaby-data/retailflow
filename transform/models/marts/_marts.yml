version: 2

models:
  - name: customer_mart
    description: "Un client par ligne, avec ses indicateurs de commandes agreges."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: sales_mart
    description: "Chiffre d'affaires agrege par jour, pays et categorie de produit."
    columns:
      - name: date
        tests:
          - not_null
      - name: country
        tests:
          - not_null
      - name: category
        tests:
          - not_null

  - name: inventory_mart
    description: "Etat des stocks par produit, avec estimation des jours de stock restants."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: stock_status
        tests:
          - accepted_values:
              arguments:
                values: ['ok', 'low_stock', 'out_of_stock']